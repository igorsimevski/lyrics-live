<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://api.telegra.ph; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="description" content="Follow published lyrics as they change, without refreshing the page.">
  <title>Lyrics Live</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="viewer.mjs"></script>
</head>
<body>
  <header>
    <a class="brand" href="./">Lyrics Live</a>
    <span id="status" role="status" aria-live="polite">Ready</span>
  </header>
  <main>
    <section id="welcome">
      <p class="eyebrow">A shared page. The next song.</p>
      <h1>Follow the lyrics.</h1>
      <p>Open the link from YouTube MP3’s QR code. When new lyrics are published, they appear here automatically.</p>
      <form id="page-form">
        <label for="page-link">Or paste your Telegraph page link</label>
        <div class="input-row">
          <input id="page-link" type="url" placeholder="https://telegra.ph/Your-lyrics-page" required autocomplete="off" aria-describedby="form-error">
          <button type="submit">Follow</button>
        </div>
        <p id="form-error" role="alert"></p>
      </form>
    </section>
    <article id="lyrics" hidden>
      <p class="eyebrow">Now published</p>
      <h1 id="song-title"></h1>
      <div id="song-text"></div>
      <footer><a id="source" target="_blank" rel="noopener noreferrer">Read on Telegraph ↗</a></footer>
    </article>
    <p id="notice" role="status" hidden></p>
  </main>
</body>
</html>
